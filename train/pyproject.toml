[project]
name = "slm-train"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pyserial>=3.5",
  "torch>=2.7",
  "transformers>=4.50",
]

[tool.uv]
package = false

# GPU(RTX 3060)용 CUDA 12.8 빌드. CI처럼 GPU가 없는 곳에서도 이 빌드로 CPU 실행은 된다
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
