name: ci
on: [push, pull_request]

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bridge } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  train-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pytest -q train/test_data.py  # 학습 예시가 실행되고 기대 출력을 내는지 (torch 불필요)

  model-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # 보드에 굽는 firmware/model.bin을 numpy로 돌려 예시 다음 줄 정확도·MBPP heldout 문법 통과율이 기준 미만이면 실패 (torch 불필요)
      - run: uv run --no-project --with numpy --with tokenizers python train/eval_bin.py --min-examples 0.95 --min-heldout-syntax 0.85

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v6  # 확장이 가짜 브리지를 uv run으로 띄운다
      - run: npm ci
      - run: npm run package  # 컴파일 + .vsix 패키징
      - run: xvfb-run -a npm test  # 실제 VS Code에서 제안 → 수락 → 브리지 통합 테스트

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
