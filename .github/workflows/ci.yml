name: ci
on: [push, pull_request]

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: bridge } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v6  # 확장이 가짜 브리지를 uv run으로 띄운다
      - run: npm ci
      - run: npm run package  # 컴파일 + .vsix 패키징
      - run: xvfb-run -a npm test  # 실제 VS Code에서 제안 → 수락 → 브리지 통합 테스트

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
